<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2833"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <pattern id="jali" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0,15 L 15,0 L 30,15 L 15,30 Z" fill="none" stroke="#C5A059" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#jali)"/>

  <!-- Museum Frame Borders -->
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#C5A059" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="596" height="436" fill="none" stroke="#C5A059" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 16,40 L 40,40 L 40,16" fill="none" stroke="#C5A059" stroke-width="3"/>
  <path d="M 624,40 L 600,40 L 600,16" fill="none" stroke="#C5A059" stroke-width="3"/>
  <path d="M 16,440 L 40,440 L 40,464" fill="none" stroke="#C5A059" stroke-width="3"/>
  <path d="M 624,440 L 600,440 L 600,464" fill="none" stroke="#C5A059" stroke-width="3"/>

  <!-- Header Banner -->
  <rect x="140" y="38" width="360" height="26" fill="#1F2833" stroke="#C5A059" stroke-width="1" rx="2"/>
  <text x="320" y="55" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#C5A059" text-anchor="middle" letter-spacing="2">
    GI REGISTERED • LADAKH
  </text>

  <!-- Central Symbol -->
  
        <!-- Changthang Mountain Peak & Fleece Waves -->
        <polygon points="320,200 410,340 230,340" fill="#C5A059" opacity="0.6"/>
        <polygon points="320,200 350,250 290,250" fill="#F6EEDB"/>
        <path d="M 230,360 Q 275,340 320,360 Q 365,380 410,360" fill="none" stroke="#F6EEDB" stroke-width="4"/>
        

  <!-- Lower Title Plaque -->
  <rect x="40" y="385" width="560" height="65" fill="#1F2833" opacity="0.9" stroke="#C5A059" stroke-width="1.5" rx="3"/>
  <text x="320" y="415" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#F6EEDB" text-anchor="middle" letter-spacing="1.5">
    LADAKH RAW PASHM
  </text>
  <text x="320" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#C5A059" text-anchor="middle" opacity="0.9">
    High Altitude Changthang Fibre
  </text>
</svg>