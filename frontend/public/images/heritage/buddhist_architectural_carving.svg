<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1A29"/>
      <stop offset="100%" stop-color="#4A2846"/>
    </linearGradient>
    <pattern id="jali" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0,15 L 15,0 L 30,15 L 15,30 Z" fill="none" stroke="#E0A96D" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#jali)"/>

  <!-- Museum Frame Borders -->
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#E0A96D" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="596" height="436" fill="none" stroke="#E0A96D" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 16,40 L 40,40 L 40,16" fill="none" stroke="#E0A96D" stroke-width="3"/>
  <path d="M 624,40 L 600,40 L 600,16" fill="none" stroke="#E0A96D" stroke-width="3"/>
  <path d="M 16,440 L 40,440 L 40,464" fill="none" stroke="#E0A96D" stroke-width="3"/>
  <path d="M 624,440 L 600,440 L 600,464" fill="none" stroke="#E0A96D" stroke-width="3"/>

  <!-- Header Banner -->
  <rect x="140" y="38" width="360" height="26" fill="#2B1A29" stroke="#E0A96D" stroke-width="1" rx="2"/>
  <text x="320" y="55" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#E0A96D" text-anchor="middle" letter-spacing="2">
    HERITAGE TRADITION • LADAKH
  </text>

  <!-- Central Symbol -->
  
        <!-- Lotus Capital &amp; Bracket -->
        <rect x="250" y="320" width="140" height="40" fill="#E0A96D" rx="4"/>
        <rect x="280" y="270" width="80" height="50" fill="#F6EEDB" rx="2"/>
        <polygon points="230,240 410,240 370,270 270,270" fill="#E0A96D" stroke="#F6EEDB" stroke-width="2"/>
        <circle cx="320" cy="295" r="14" fill="#2B1A29"/>
        

  <!-- Lower Title Plaque -->
  <rect x="40" y="385" width="560" height="65" fill="#2B1A29" opacity="0.9" stroke="#E0A96D" stroke-width="1.5" rx="3"/>
  <text x="320" y="415" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#F6EEDB" text-anchor="middle" letter-spacing="1.5">
    LADAKHI WOOD CARVING
  </text>
  <text x="320" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#E0A96D" text-anchor="middle" opacity="0.9">
    Monastery Pillars &amp; Capital Mandalas
  </text>
</svg>