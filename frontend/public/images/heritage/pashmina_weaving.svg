<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1013"/>
      <stop offset="100%" stop-color="#4A1C20"/>
    </linearGradient>
    <pattern id="jali" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0,15 L 15,0 L 30,15 L 15,30 Z" fill="none" stroke="#C8A24A" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#jali)"/>

  <!-- Museum Frame Borders -->
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#C8A24A" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="596" height="436" fill="none" stroke="#C8A24A" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 16,40 L 40,40 L 40,16" fill="none" stroke="#C8A24A" stroke-width="3"/>
  <path d="M 624,40 L 600,40 L 600,16" fill="none" stroke="#C8A24A" stroke-width="3"/>
  <path d="M 16,440 L 40,440 L 40,464" fill="none" stroke="#C8A24A" stroke-width="3"/>
  <path d="M 624,440 L 600,440 L 600,464" fill="none" stroke="#C8A24A" stroke-width="3"/>

  <!-- Header Banner -->
  <rect x="140" y="38" width="360" height="26" fill="#2E1013" stroke="#C8A24A" stroke-width="1" rx="2"/>
  <text x="320" y="55" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#C8A24A" text-anchor="middle" letter-spacing="2">
    GI REGISTERED • JAMMU &amp; KASHMIR
  </text>

  <!-- Central Symbol -->
  
        <!-- Paisley / Buta motif -->
        <path d="M 320,180 C 270,180 230,220 230,270 C 230,330 280,370 320,410 C 360,370 410,330 410,270 C 410,220 370,180 320,180 Z" fill="#C8A24A" opacity="0.35"/>
        <path d="M 320,200 C 285,200 255,230 255,270 C 255,315 295,350 320,380 C 345,350 385,315 385,270 C 385,230 355,200 320,200 Z" fill="#B0673A" opacity="0.6"/>
        <circle cx="320" cy="270" r="28" fill="#F6EEDB" opacity="0.9"/>
        <path d="M 320,220 Q 340,250 320,280 Q 300,310 320,340" stroke="#2E1013" stroke-width="4" fill="none"/>
        

  <!-- Lower Title Plaque -->
  <rect x="40" y="385" width="560" height="65" fill="#2E1013" opacity="0.9" stroke="#C8A24A" stroke-width="1.5" rx="3"/>
  <text x="320" y="415" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#F6EEDB" text-anchor="middle" letter-spacing="1.5">
