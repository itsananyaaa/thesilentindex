<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68131B"/>
      <stop offset="100%" stop-color="#8F252C"/>
    </linearGradient>
    <pattern id="jali" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0,15 L 15,0 L 30,15 L 15,30 Z" fill="none" stroke="#F4B41A" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#jali)"/>

  <!-- Museum Frame Borders -->
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#F4B41A" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="596" height="436" fill="none" stroke="#F4B41A" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 16,40 L 40,40 L 40,16" fill="none" stroke="#F4B41A" stroke-width="3"/>
  <path d="M 624,40 L 600,40 L 600,16" fill="none" stroke="#F4B41A" stroke-width="3"/>
  <path d="M 16,440 L 40,440 L 40,464" fill="none" stroke="#F4B41A" stroke-width="3"/>
  <path d="M 624,440 L 600,440 L 600,464" fill="none" stroke="#F4B41A" stroke-width="3"/>

  <!-- Header Banner -->
  <rect x="140" y="38" width="360" height="26" fill="#68131B" stroke="#F4B41A" stroke-width="1" rx="2"/>
  <text x="320" y="55" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#F4B41A" text-anchor="middle" letter-spacing="2">
    GI REGISTERED • MULTI-STATE
  </text>

  <!-- Central Symbol -->
  
        <!-- Geometric Star / Bagh Pattern -->
        <polygon points="320,190 350,250 410,250 365,290 380,350 320,315 260,350 275,290 230,250 290,250" fill="#F4B41A" stroke="#F6EEDB" stroke-width="3"/>
        <circle cx="320" cy="275" r="22" fill="#68131B"/>
        

  <!-- Lower Title Plaque -->
  <rect x="40" y="385" width="560" height="65" fill="#68131B" opacity="0.9" stroke="#F4B41A" stroke-width="1.5" rx="3"/>
  <text x="320" y="415" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#F6EEDB" text-anchor="middle" letter-spacing="1.5">
    PHULKARI EMBROIDERY
  </text>
  <text x="320" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#F4B41A" text-anchor="middle" opacity="0.9">
    Geometric Silk Floss on Khaddar
  </text>
</svg>