<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1C20"/>
      <stop offset="100%" stop-color="#6B2F27"/>
    </linearGradient>
    <pattern id="jali" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0,15 L 15,0 L 30,15 L 15,30 Z" fill="none" stroke="#E6C260" stroke-width="0.75" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bgGrad)"/>
  <rect width="640" height="480" fill="url(#jali)"/>

  <!-- Museum Frame Borders -->
  <rect x="16" y="16" width="608" height="448" fill="none" stroke="#E6C260" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="596" height="436" fill="none" stroke="#E6C260" stroke-width="0.75" opacity="0.4"/>

  <!-- Corner Brackets -->
  <path d="M 16,40 L 40,40 L 40,16" fill="none" stroke="#E6C260" stroke-width="3"/>
  <path d="M 624,40 L 600,40 L 600,16" fill="none" stroke="#E6C260" stroke-width="3"/>
  <path d="M 16,440 L 40,440 L 40,464" fill="none" stroke="#E6C260" stroke-width="3"/>
  <path d="M 624,440 L 600,440 L 600,464" fill="none" stroke="#E6C260" stroke-width="3"/>

  <!-- Header Banner -->
  <rect x="140" y="38" width="360" height="26" fill="#4A1C20" stroke="#E6C260" stroke-width="1" rx="2"/>
  <text x="320" y="55" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="bold" fill="#E6C260" text-anchor="middle" letter-spacing="2">
    GI REGISTERED • JAMMU & KASHMIR
  </text>

  <!-- Central Symbol -->
  
        <!-- Loom Warps & Weft Kanis -->
        <g stroke="#E6C260" stroke-width="3" opacity="0.8">
          <line x1="220" y1="200" x2="420" y2="200"/>
          <line x1="220" y1="240" x2="420" y2="240"/>
          <line x1="220" y1="280" x2="420" y2="280"/>
          <line x1="220" y1="320" x2="420" y2="320"/>
          <line x1="220" y1="360" x2="420" y2="360"/>
        </g>
        <!-- Diamond Pattern Grid -->
        <polygon points="320,210 390,280 320,350 250,280" fill="#E6C260" opacity="0.45" stroke="#F6EEDB" stroke-width="3"/>
        <polygon points="320,240 360,280 320,320 280,280" fill="#F6EEDB" opacity="0.85"/>
        

  <!-- Lower Title Plaque -->
  <rect x="40" y="385" width="560" height="65" fill="#4A1C20" opacity="0.9" stroke="#E6C260" stroke-width="1.5" rx="3"/>
  <text x="320" y="415" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="bold" fill="#F6EEDB" text-anchor="middle" letter-spacing="1.5">
    KANI SHAWL WEAVING
  </text>
  <text x="320" y="438" font-family="system-ui, sans-serif" font-size="11" fill="#E6C260" text-anchor="middle" opacity="0.9">
    Talim Coded Spool Loom Pattern
  </text>
</svg>