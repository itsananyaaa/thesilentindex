sensitivity_keywords:
  - term: "sacred"
    notice: "This record references sacred or consecrated traditions. Treat with cultural reverence."
  - term: "ritual"
    notice: "This tradition involves living or historical ritual practice."
  - term: "tribal"
    notice: "This tradition pertains to indigenous/Adivasi heritage. Community consultation is required before documentation."
  - term: "adivasi"
    notice: "This tradition pertains to indigenous/Adivasi heritage. Free, Prior and Informed Consent (FPIC) applies."
  - term: "funerary"
    notice: "This artifact is associated with burial, funerary, or memorial traditions."
  - term: "secret"
    notice: "May involve restricted knowledge or initiated-only oral traditions."

